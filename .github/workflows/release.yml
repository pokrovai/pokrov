name: Release

on:
  push:
    tags:
      - "v*"
  # Manual/Auto Release dispatch: GITHUB_TOKEN pushes cannot retrigger
  # push-based workflows, so auto-release.yml hands the computed tag over
  # through this input instead of relying on the tag push itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z); must already point at the target commit"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the release checklist requires `cargo test` to pass on the
  # release commit before any artifact is published.
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked

  # Static onnxruntime link keeps the binary self-contained; `--features ner`
  # only enables the lazy init path, so parity with the Docker image is free.
  binaries:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build pokrov-runtime
        run: cargo build --locked --release -p pokrov-runtime --features ner --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          pkg="pokrov-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/pokrov-runtime" "dist/$pkg/"
          cp config/pokrov.example.yaml "dist/$pkg/pokrov.example.yaml"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  # Pushes ghcr.io/<owner>/pokrov:<semver> and :latest; multi-arch build runs
  # the NER model download under QEMU for arm64, so this job is the slow one.
  docker:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Generate release evidence scaffold
        run: |
          set -euo pipefail
          mkdir -p /tmp/rt
          tar -xzf "dist/pokrov-${RELEASE_TAG}-linux-amd64.tar.gz" -C /tmp/rt
          artifacts=(dist/*.tar.gz)
          cmd=(/tmp/rt/*/pokrov-runtime --release-evidence-output dist/release-evidence.json --release-id "$RELEASE_TAG")
          for f in "${artifacts[@]}"; do cmd+=(--artifact "$f"); done
          "${cmd[@]}"
          cat dist/release-evidence.json | head -20
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG" dist/*
